<!doctype html>

<div class="pagina-registro">

  <div class="tarjeta">

    <div class="logo">L</div>

    <h1>Crear cuenta</h1>
    <p class="subtitulo">
      Regístrate para comenzar a utilizar LabManager.
    </p>

    <div *ngIf="error" class="alerta error">
      {{ error }}
    </div>

    <div *ngIf="mensaje" class="alerta exito">
      {{ mensaje }}
    </div>

    <form (ngSubmit)="registrar()">

      <div class="campo">
        <label for="username">Nombre de usuario</label>
        <input
          id="username"
          name="username"
          type="text"
          [(ngModel)]="username"
          placeholder="Ingresa tu usuario"
          autocomplete="username"
          required
        />
      </div>

      <div class="campo">
        <label for="password">Contraseña</label>
        <input
          id="password"
          name="password"
          type="password"
          [(ngModel)]="password"
          placeholder="Ingresa una contraseña"
          autocomplete="new-password"
          required
        />
      </div>

      <div class="campo">
        <label for="confirmarPassword">Confirmar contraseña</label>
        <input
          id="confirmarPassword"
          name="confirmarPassword"
          type="password"
          [(ngModel)]="confirmarPassword"
          placeholder="Repite tu contraseña"
          autocomplete="new-password"
          required
        />
      </div>

      <button
        type="submit"
        class="btn-registrar"
        [disabled]="cargando">
        {{ cargando ? 'Creando cuenta...' : 'Crear cuenta' }}
      </button>

    </form>

    <p class="login">
      ¿Ya tienes una cuenta?
      <a routerLink="/login">Iniciar sesión</a>
    </p>

  </div>

</div>
